<svg width="390" height="844" viewBox="0 0 390 844" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="390" height="844" rx="44" fill="#0B1120"/>
  <text x="32" y="38" fill="#F8FAFC" font-family="Inter, sans-serif" font-size="14" font-weight="600">09:41</text>
  <text x="320" y="38" fill="#F8FAFC" font-family="Inter, sans-serif" font-size="12" font-weight="600">5G 🔋</text>

  <!-- Top Bar -->
  <text x="24" y="75" fill="#94A3B8" font-size="16">❮ Back</text>
  <text x="195" y="75" text-anchor="middle" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="16" font-weight="800">Safety Guide</text>
  <text x="366" y="75" text-anchor="end" fill="#60A5FA" font-family="Inter, sans-serif" font-size="12" font-weight="700">🔊 Read</text>

  <!-- Hazard Tabs -->
  <rect x="20" y="95" width="85" height="36" rx="12" fill="#2563EB"/>
  <text x="62" y="118" text-anchor="middle" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="12" font-weight="700">🌊 Floods</text>

  <rect x="112" y="95" width="95" height="36" rx="12" fill="#1E293B"/>
  <text x="159" y="118" text-anchor="middle" fill="#94A3B8" font-family="Inter, sans-serif" font-size="12">⛰️ Landslides</text>

  <rect x="214" y="95" width="85" height="36" rx="12" fill="#1E293B"/>
  <text x="256" y="118" text-anchor="middle" fill="#94A3B8" font-family="Inter, sans-serif" font-size="12">🌀 Cyclones</text>

  <rect x="306" y="95" width="64" height="36" rx="12" fill="#1E293B"/>
  <text x="338" y="118" text-anchor="middle" fill="#94A3B8" font-family="Inter, sans-serif" font-size="12">🌊 Tsunami</text>

  <!-- Evacuate vs Shelter Toggle -->
  <rect x="20" y="145" width="350" height="48" rx="14" fill="#1E293B" stroke="#334155"/>
  <rect x="24" y="149" width="170" height="40" rx="12" fill="#DC2626"/>
  <text x="109" y="174" text-anchor="middle" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="13" font-weight="800">🚨 Evacuate Now</text>
  <text x="281" y="174" text-anchor="middle" fill="#94A3B8" font-family="Inter, sans-serif" font-size="13" font-weight="600">🏠 Shelter in Place</text>

  <!-- Step Cards -->
  <rect x="20" y="210" width="350" height="90" rx="18" fill="#1E293B" stroke="#334155"/>
  <rect x="34" y="225" width="40" height="40" rx="10" fill="#0F172A"/>
  <text x="54" y="251" text-anchor="middle" font-size="18">🏃</text>
  <text x="86" y="238" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="14" font-weight="800">1. Move to High Ground</text>
  <text x="86" y="258" fill="#CBD5E1" font-family="Inter, sans-serif" font-size="11">Immediately head to designated shelter or</text>
  <text x="86" y="274" fill="#CBD5E1" font-family="Inter, sans-serif" font-size="11">elevated halls. Never walk in 15cm+ flow.</text>

  <rect x="20" y="315" width="350" height="90" rx="18" fill="#1E293B" stroke="#334155"/>
  <rect x="34" y="330" width="40" height="40" rx="10" fill="#0F172A"/>
  <text x="54" y="356" text-anchor="middle" font-size="18">🔌</text>
  <text x="86" y="343" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="14" font-weight="800">2. Disconnect Power & Gas</text>
  <text x="86" y="363" fill="#CBD5E1" font-family="Inter, sans-serif" font-size="11">Switch off main electrical breakers and LPG</text>
  <text x="86" y="379" fill="#CBD5E1" font-family="Inter, sans-serif" font-size="11">cylinders before floodwaters enter home.</text>

  <rect x="20" y="420" width="350" height="90" rx="18" fill="#1E293B" stroke="#334155"/>
  <rect x="34" y="435" width="40" height="40" rx="10" fill="#0F172A"/>
  <text x="54" y="461" text-anchor="middle" font-size="18">🎒</text>
  <text x="86" y="448" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="14" font-weight="800">3. Grab Emergency Go-Bag</text>
  <text x="86" y="468" fill="#CBD5E1" font-family="Inter, sans-serif" font-size="11">Take your waterproof pack with medicines,</text>
  <text x="86" y="484" fill="#CBD5E1" font-family="Inter, sans-serif" font-size="11">drinking water, NIC cards, and deeds.</text>

  <rect x="20" y="525" width="350" height="90" rx="18" fill="#1E293B" stroke="#334155"/>
  <rect x="34" y="540" width="40" height="40" rx="10" fill="#0F172A"/>
  <text x="54" y="566" text-anchor="middle" font-size="18">🚫</text>
  <text x="86" y="553" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="14" font-weight="800">4. Avoid Riverbanks & Bridges</text>
  <text x="86" y="573" fill="#CBD5E1" font-family="Inter, sans-serif" font-size="11">Stay clear of culverts and river shoulders</text>
  <text x="86" y="589" fill="#CBD5E1" font-family="Inter, sans-serif" font-size="11">which may collapse without warning.</text>

  <!-- Button to Shelters -->
  <rect x="20" y="680" width="350" height="56" rx="20" fill="#2563EB"/>
  <text x="195" y="715" text-anchor="middle" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="15" font-weight="800">Find Safe Shelter on Map ➔</text>
</svg>